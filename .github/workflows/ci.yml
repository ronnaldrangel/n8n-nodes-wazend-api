name: Validate Wazend node
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:branding
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run lint:dist
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: wazend-node-package
          path: '*.tgz'
